name: Keep Stock Predictor Alive

on:
  schedule:
    # Run every ten minutes, offset from the top of the hour to reduce delays.
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-predictor-keep-alive
  cancel-in-progress: true

jobs:
  ping-stock-predictor:
    name: Ping Stock Predictor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STOCK_PREDICTOR_HEALTH_URL: https://stockpredictiongame.onrender.com/actuator/health

    steps:
      - name: Ping Stock Predictor health endpoint
        shell: bash
        run: |
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            "$STOCK_PREDICTOR_HEALTH_URL"
