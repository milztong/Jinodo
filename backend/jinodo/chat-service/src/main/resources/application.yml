spring:
  application:
    name: chat-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jinodo}
    username: ${DB_USER:jinodo}
    password: ${DB_PASSWORD:jinodo_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    # Schema wird zentral vom processing-service verwaltet (shared DB).
    # chat-service ist reiner Konsument — kein eigenständiges Flyway.
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jinodo:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-32-chars}
  presence:
    heartbeat-interval-seconds: 30
    expiry-seconds: 60

logging:
  level:
    dev.jinodo: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
